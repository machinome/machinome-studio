version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# The manual builds from docs/requirements.txt alone: Sphinx and its theme.
# conf.py reads the floor's source as text and imports nothing of the
# runtime, so no other package, tool or build step is needed. Pinned by
# tests/test_documentation.py.
python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
